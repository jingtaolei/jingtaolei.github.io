# Keep developer material in GitHub, outside the public Pages build.
exclude:
  - "README.md"
  - "maintenance"
  - "design-notes"
  - "tools"
  - "cloudflare-worker"
  - "node_modules"
  - "dist"
  - "assets/art"
  - "assets/icons"
  - "assets/cv"
  - "assets/portraits"
  - "styles.css"
  - "surfaces.css"
  - "scene.js"
  - "interaction.js"
  - "script.js"
  - "version-check.js"
  - "analytics-config.js"
  - "collection.js"
  - "connection-check.js"
  - "favicon.svg"
  - "asset-manifest.json"
  - "site-build.json"
  - "package.json"
  - "package-lock.json"
  - ".sass-cache"
  - ".jekyll-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
  - "**/__pycache__"
  - "**/*.pyc"
  - "**/.DS_Store"
  - "VERSION.json"
  - "VERSION.md"
  - "evidence"
  - "context"
